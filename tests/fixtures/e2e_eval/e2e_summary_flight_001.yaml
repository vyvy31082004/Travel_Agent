id: e2e_summary_flight_001
scenario: "T1–T2 rồi summarize_conversation; T3 search flight từ summary (SGN–HAN 12/10, 1 người, không ký gửi) + buổi sáng; LTM economy + nonstop; NO_STORE"

seed:
  user_id: user_a
  long_term_memories:
    - id: m_economy
      text: "Thường bay hạng phổ thông (economy) khi đi du lịch"
      domain: flight
      category: flight_preference
      status: active
    - id: m_direct
      text: "Ưu tiên bay thẳng, tránh nối chuyến"
      domain: flight
      category: flight_preference
      status: active
    - id: m_other_user
      text: "Memory user khác — thích business class"
      domain: flight
      category: flight_preference
      user_id: user_b
      status: active
      expect_in_context: false
    - id: m_superseded
      text: "Preference cũ — chỉ bay Vietnam Airlines"
      domain: flight
      category: flight_preference
      status: superseded
      expect_in_context: false
  thread_state:
    messages: []
    summary: null

input:
  messages:
    - "Mình đang tính bay từ TP.HCM ra Hà Nội, chưa cần tìm vé."
    - "Bay ngày 12/10, 1 người, không ký gửi hành lý."
    - "Tìm chuyến buổi sáng giúp tôi."

expected_trace:
  expected_route: [flight]
  expected_context:
    flight:
      must_include: [m_economy, m_direct]
      must_exclude: [m_other_user, m_superseded]
      expected_applicability:
        m_economy: apply
        m_direct: apply
  expected_tools:
    - name: search_one_way_flights_tool
      required_arguments: [origin, destination, departure_date]
  expected_node_sequence_contains:
    - memory_recall_global
    - primary_assistant
    - summarize_conversation
    - memory_finalize
    - memory_recall_global
    - primary_assistant
    - flight_assistant
    - memory_recall_flight
    - flight_chat
    - search_one_way_flights_tool
    - join_results
    - primary_assistant
    - memory_finalize

expected_answer_rubric:
  answerability: ANSWERABLE
  required_constraints:
    - "search/answer giữ SGN–HAN, ngày 12/10, 1 người, không hành lý ký gửi từ summary"
    - "thêm filter buổi sáng từ T3"
    - "economy và ưu tiên bay thẳng từ memory domain"
  tradeoff_rule:
    - "Nếu không có bay thẳng buổi sáng, nêu rõ điều kiện nào chưa thỏa"
  forbidden_claims:
    - "Giá/hãng/chuyến không có trong tool result"
    - "Viện dẫn preference không tồn tại hoặc inactive"
    - "Dùng ngày bay cũ khác 12/10"

expected_finalize:
  action: NO_STORE
