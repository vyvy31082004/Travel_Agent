id: e2e_summary_hotel_001
scenario: "T1–T2 rồi summarize_conversation; T3 search hotel từ summary (Đà Nẵng 10–12/10, 2 người, 1–2 triệu) conflict LTM dưới 1 triệu + gần biển; NO_STORE"

seed:
  user_id: user_a
  long_term_memories:
    - id: m_beach
      text: "Thích khách sạn gần biển"
      domain: hotel
      category: hotel_preference
      status: active
    - id: m_budget
      text: "Ngân sách hotel thường dưới 1 triệu/đêm"
      domain: hotel
      category: hotel_preference
      status: active
    - id: m_other_user
      text: "Memory user khác — thích resort cao cấp"
      domain: hotel
      category: hotel_preference
      user_id: user_b
      status: active
      expect_in_context: false
    - id: m_superseded
      text: "Preference cũ đã superseded — thích hostel"
      domain: hotel
      category: hotel_preference
      status: superseded
      expect_in_context: false
  thread_state:
    messages: []
    summary: null

input:
  messages:
    - "Mình đang lên kế hoạch đi Đà Nẵng thôi, chưa cần tìm khách sạn."
    - "Ở từ 10 đến 12/10, 2 người, ngân sách 1–2 triệu một đêm."
    - "Tìm khách sạn luôn đi."

expected_trace:
  expected_route: [hotel]
  expected_context:
    hotel:
      must_include: [m_beach]
      must_exclude: [m_other_user, m_superseded]
      expected_applicability:
        m_beach: uncertain
        m_budget: overridden
  expected_tools:
    - name: search_hotels_tool
      required_arguments: [destination, check_in, check_out]
  expected_node_sequence_contains:
    - memory_recall_global
    - primary_assistant
    - summarize_conversation
    - memory_finalize
    - memory_recall_global
    - primary_assistant
    - hotel_assistant
    - memory_recall_hotel
    - hotel_chat
    - search_hotels_tool
    - join_results
    - primary_assistant
    - memory_finalize

expected_answer_rubric:
  answerability: ANSWERABLE
  required_constraints:
    - "search/answer giữ Đà Nẵng, 10–12/10, 2 người, 1–2 triệu/đêm từ summary"
    - "ưu tiên gần biển nếu tool có evidence"
  tradeoff_rule:
    - "Conflict ngân sách: ưu tiên 1–2 triệu của turn/summary hiện tại; không ép xuống dưới 1 triệu seeded"
  forbidden_claims:
    - "Viện dẫn ngân sách dưới 1 triệu seeded như constraint hiện tại"
    - "Giá/đặc điểm không có trong tool result"
    - "Viện dẫn preference không tồn tại hoặc inactive"

expected_finalize:
  action: NO_STORE
