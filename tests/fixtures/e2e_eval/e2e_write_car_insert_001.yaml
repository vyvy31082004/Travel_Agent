id: e2e_write_car_insert_001
scenario: "Không có car memory; từ giờ ưu tiên xe 5 chỗ số tự động + search Đà Nẵng; hai INSERT"

seed:
  user_id: user_a
  long_term_memories:
    - id: m_other_user
      text: "Memory user khác — thích xe số sàn"
      domain: car
      category: car_preference
      user_id: user_b
      status: active
      expect_in_context: false
    - id: m_superseded
      text: "Preference cũ — chỉ thuê xe 4 chỗ"
      domain: car
      category: car_preference
      status: superseded
      expect_in_context: false
  thread_state:
    messages: []
    summary: null

input:
  messages:
    - "Từ giờ khi thuê xe tôi ưu tiên xe 5 chỗ số tự động. Tìm xe ở Đà Nẵng từ 10–12/10."

expected_trace:
  expected_route: [car]
  expected_context:
    car:
      must_include: []
      must_exclude: [m_other_user, m_superseded]
  expected_tools:
    - name: search_cars_tool
      required_arguments: [location, pickup_date, return_date]
  expected_node_sequence_contains:
    - memory_recall_global
    - primary_assistant
    - car_assistant
    - memory_recall_car
    - car_chat
    - search_cars_tool
    - join_results
    - primary_assistant
    - memory_finalize

expected_answer_rubric:
  answerability: ANSWERABLE
  required_constraints:
    - "xe Đà Nẵng 10–12/10"
    - "chỉ nhận xe 5 chỗ/số tự động khi tool có fields xác nhận"
  tradeoff_rule:
    - "Nếu tool thiếu số chỗ hoặc hộp số, nêu giới hạn — không bịa 5 chỗ/tự động"
  forbidden_claims:
    - "Giá/phụ phí không có trong tool result"
    - "Viện dẫn preference car seeded không tồn tại"

expected_finalize:
  action: INSERT
  memories:
    - domain: car
      category: car_preference
      text_contains: ["5 chỗ"]
    - domain: car
      category: car_preference
      text_contains: ["tự động"]
