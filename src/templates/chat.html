<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Travel Chatbot</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI',
          sans-serif;
        background: #f0f1f4;
        color: #e5e7eb;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }

      .chat-wrapper {
        width: 100%;
        max-width: 480px;
        height: 90vh;
        max-height: 720px;
        background: #6365f180;
        border-radius: 16px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .chat-header {
        padding: 12px 16px;
        background: linear-gradient(135deg, #0ea4e97b, #6366f1);
        color: #f9fafb;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .chat-header-title {
        font-weight: 600;
      }

      .chat-header-subtitle {
        font-size: 12px;
        opacity: 0.9;
      }

      .chat-messages {
        flex: 1;
        padding: 12px 12px 4px;
        overflow-y: auto;
        background: radial-gradient(circle at top, #f8f8f8 0, #435acdb4 45%);
      }

      .message-row {
        display: flex;
        margin-bottom: 8px;
      }

      .message-row.user {
        justify-content: flex-end;
      }

      .message-row.ai {
        justify-content: flex-start;
      }

      .message {
        padding: 8px 12px;
        border-radius: 999px;
        max-width: 80%;
        font-size: 14px;
        line-height: 1.4;
        word-break: break-word;
      }

      .message.user {
        background: #0ea5e9;
        color: #f9fafb;
        border-bottom-right-radius: 4px;
      }

      .message.ai {
        background: #fdfeff;
        color: #000000;
        border-bottom-left-radius: 4px;
      }

      .chat-input-bar {
        padding: 10px 12px 12px;
        border-top: 1px solid #435acdb4;
        background: #435acdb4;
        display: flex;
        gap: 8px;
      }

      .chat-input {
        flex: 1;
        padding: 8px 12px;
        border-radius: 999px;
        border: 1px solid #1f2937;
        background: #aab2d6;
        color: #090909;
        font-size: 14px;
        outline: none;
      }

      .chat-input::placeholder {
        color: #e7eaef;
      }

      .chat-button {
        padding: 8px 14px;
        border-radius: 999px;
        border: none;
        background: #acb9e4;
        color: #022c22;
        font-weight: 600;
        cursor: pointer;
        font-size: 14px;
      }

      .chat-button:disabled {
        background: #4b5563;
        cursor: not-allowed;
        color: #9ca3af;
      }

      .system-hint {
        font-size: 11px;
        color: #000307ee;
        text-align: center;
        padding: 4px 12px 8px;
      }
    </style>
  </head>
  <body>
    <div class="chat-wrapper">
      <header class="chat-header">
        <div>
          <div class="chat-header-title">Travel Assistant</div>
          <div class="chat-header-subtitle">
            Hỏi về chuyến bay, khách sạn, thuê xe...
          </div>
        </div>
      </header>

      <main id="messages" class="chat-messages">
        <div class="message-row ai">
          <div class="message ai">
            Xin chào! Tôi có thể giúp gì cho chuyến đi của bạn hôm nay?
          </div>
        </div>
      </main>

      <div class="system-hint">
        Ví dụ: "Hi there, what time is my flight?" hoặc "Tìm khách sạn ở Đà
        Nẵng rating 9.0"
      </div>

      <form id="chat-form" class="chat-input-bar">
        <input
          id="message-input"
          class="chat-input"
          type="text"
          autocomplete="off"
          placeholder="Nhập tin nhắn..."
        />
        <button id="send-button" class="chat-button" type="submit">
          Gửi
        </button>
      </form>
    </div>

    <script>
      const messagesEl = document.getElementById('messages');
      const formEl = document.getElementById('chat-form');
      const inputEl = document.getElementById('message-input');
      const sendButtonEl = document.getElementById('send-button');

      let threadId = null;

      function appendMessage(text, sender) {
        const row = document.createElement('div');
        row.className = 'message-row ' + sender;

        const bubble = document.createElement('div');
        bubble.className = 'message ' + sender;
        // bubble.textContent = text;
        bubble.innerHTML = marked.parse(text);


        row.appendChild(bubble);
        messagesEl.appendChild(row);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      formEl.addEventListener('submit', async (e) => {
        e.preventDefault();
        const text = inputEl.value.trim();
        if (!text) return;

        appendMessage(text, 'user');
        inputEl.value = '';
        inputEl.focus();

        sendButtonEl.disabled = true;

        try {
          const res = await fetch('/chat', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ msg: text, thread_id: threadId }),
          });

          if (!res.ok) {
            throw new Error('Network response was not ok');
          }

          const data = await res.json();
          threadId = data.thread_id;
          appendMessage(data.response, 'ai');
        } catch (err) {
          console.error(err);
          appendMessage(
            'Xin lỗi, đã có lỗi khi kết nối tới máy chủ. Vui lòng thử lại.',
            'ai'
          );
        } finally {
          sendButtonEl.disabled = false;
        }
      });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  </body>
  </html>
