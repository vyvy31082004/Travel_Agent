<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Đăng nhập - VietTrip AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      :root {
        --bg: #f7f4ee;
        --surface: #fffdf8;
        --surface-muted: #f1f3ef;
        --text: #17211b;
        --muted: #68746d;
        --line: #dfe5dc;
        --green: #1f5f45;
        --green-strong: #174b36;
        --red: #b13b32;
        --champagne: #d7b56d;
        --shadow: 0 24px 70px rgba(26, 39, 31, 0.13);
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text);
        background:
          linear-gradient(140deg, rgba(31, 95, 69, 0.08) 0 1px, transparent 1px 34px),
          radial-gradient(circle at 84% 18%, rgba(215, 181, 109, 0.22), transparent 30%),
          linear-gradient(135deg, #fbfaf6 0%, var(--bg) 58%, #eef3ed 100%);
      }

      body::after {
        content: "";
        position: fixed;
        right: 0;
        top: 8%;
        width: min(34vw, 420px);
        height: 78vh;
        pointer-events: none;
        opacity: 0.22;
        background:
          linear-gradient(155deg, transparent 35%, rgba(31, 95, 69, 0.3) 36%, transparent 37%),
          linear-gradient(145deg, transparent 48%, rgba(215, 181, 109, 0.36) 49%, transparent 50%),
          linear-gradient(160deg, transparent 58%, rgba(177, 59, 50, 0.22) 59%, transparent 60%);
        border-radius: 999px 0 0 999px;
      }

      a { color: var(--green); font-weight: 700; text-decoration: none; }
      a:hover { text-decoration: underline; }

      .bg-wordmark {
        position: fixed;
        left: 50%;
        top: 48%;
        z-index: 0;
        transform: translate(-50%, -50%) rotate(-10deg);
        pointer-events: none;
        user-select: none;
        font-size: clamp(72px, 18vw, 200px);
        font-weight: 900;
        letter-spacing: -0.06em;
        line-height: 0.9;
        white-space: nowrap;
        color: transparent;
        background: linear-gradient(
          120deg,
          rgba(31, 95, 69, 0.1) 0%,
          rgba(215, 181, 109, 0.14) 45%,
          rgba(31, 95, 69, 0.08) 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
      }

      .bg-wordmark span {
        display: block;
        margin-left: 0.12em;
        font-size: 0.42em;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-weight: 700;
        color: rgba(31, 95, 69, 0.07);
        background: none;
        -webkit-background-clip: unset;
        background-clip: unset;
      }

      .auth-card {
        position: relative;
        z-index: 1;
        width: min(100%, 440px);
        padding: 34px;
        border: 1px solid rgba(31, 95, 69, 0.12);
        border-radius: 28px;
        background: rgba(255, 253, 248, 0.94);
        box-shadow: var(--shadow);
        backdrop-filter: blur(18px);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 28px;
      }

      .brand-mark {
        position: relative;
        display: grid;
        width: 48px;
        height: 48px;
        place-items: center;
        border: 1px solid rgba(31, 95, 69, 0.18);
        border-radius: 17px;
        background: linear-gradient(145deg, #ffffff, #eef5ef);
        color: var(--green);
      }

      .brand-mark::after {
        content: "";
        position: absolute;
        top: 9px;
        right: 9px;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--red);
        box-shadow: 0 0 0 4px rgba(177, 59, 50, 0.1);
      }

      .brand h1 {
        font-size: 24px;
        letter-spacing: -0.045em;
      }

      .brand p,
      .subtitle {
        color: var(--muted);
        font-size: 14px;
        margin-top: 3px;
      }

      .subtitle { margin-bottom: 24px; line-height: 1.55; }

      .field { margin-bottom: 16px; }

      label {
        display: block;
        margin-bottom: 7px;
        color: #2d3a32;
        font-size: 13px;
        font-weight: 800;
      }

      input[type="email"],
      input[type="password"] {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 15px;
        padding: 13px 14px;
        background: var(--surface-muted);
        color: var(--text);
        outline: none;
      }

      input:focus-visible,
      button:focus-visible,
      a:focus-visible {
        outline: 3px solid rgba(215, 181, 109, 0.55);
        outline-offset: 3px;
      }

      .form-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin: 4px 0 22px;
        color: var(--muted);
        font-size: 13px;
      }

      .remember {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .primary-button {
        width: 100%;
        border: 0;
        border-radius: 999px;
        padding: 14px 18px;
        background: var(--green);
        color: #fffdf8;
        cursor: pointer;
        font-weight: 800;
        box-shadow: 0 16px 34px rgba(31, 95, 69, 0.2);
      }

      .primary-button:hover { background: var(--green-strong); }

      .auth-footer {
        margin-top: 24px;
        color: var(--muted);
        text-align: center;
        font-size: 14px;
      }

      .back-link {
        display: inline-flex;
        margin-top: 20px;
        color: var(--muted);
        font-size: 13px;
      }

      @media (max-width: 520px) {
        body { padding: 14px; }
        .auth-card { padding: 24px; border-radius: 24px; }
        .form-row { align-items: flex-start; flex-direction: column; }
        .bg-wordmark { font-size: clamp(56px, 22vw, 120px); opacity: 0.85; }
      }
    </style>
  </head>
  <body>
    <div class="bg-wordmark" aria-hidden="true">
      VietTrip
      <span>Travel smarter</span>
    </div>
    <main class="auth-card" aria-label="Đăng nhập VietTrip AI">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M12 2.8 15.2 8.8 21.2 12 15.2 15.2 12 21.2 8.8 15.2 2.8 12 8.8 8.8 12 2.8Z" />
            <path d="m10.4 10.4 4.2-1-1 4.2-4.2 1 1-4.2Z" />
          </svg>
        </div>
        <div>
          <h1>VietTrip AI</h1>
          <p>Trợ lý lập kế hoạch du lịch thông minh</p>
        </div>
      </div>

      <p class="subtitle">Đăng nhập để tiếp tục cuộc trò chuyện, lưu sở thích du lịch và quản lý kế hoạch của bạn.</p>
      {% if error %}
      <p class="subtitle" role="alert" style="color: var(--red); font-weight: 700;">{{ error }}</p>
      {% endif %}

      <form action="/login" method="post">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="ban@example.com" value="{{ email or '' }}" required />
        </div>
        <div class="field">
          <label for="password">Mật khẩu</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required />
        </div>
        <div class="form-row">
          <label class="remember" for="remember"><input id="remember" name="remember" type="checkbox" /> Ghi nhớ đăng nhập</label>
          <a href="#">Quên mật khẩu?</a>
        </div>
        <button class="primary-button" type="submit">Đăng nhập</button>
      </form>

      <p class="auth-footer">Chưa có tài khoản? <a href="/register">Đăng ký</a></p>
      <a class="back-link" href="/">← Quay lại VietTrip AI</a>
    </main>
  </body>
</html>
